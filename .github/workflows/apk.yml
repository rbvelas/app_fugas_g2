name: Compilar APK
on: [workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Generar carpeta android si falta
        run: |
          if [ ! -d android ]; then flutter create . --platforms=android --org com.unt.g2 --project-name fugas_g2; fi
          rm -f test/widget_test.dart
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: Nombre e icono
        run: |
          sed -i 's#android:label="[^"]*"#android:label="Aqualerta"#' android/app/src/main/AndroidManifest.xml
          dart run flutter_launcher_icons
      - run: flutter test
      - name: Compilar APK (con reintentos)
        run: |
          for i in 1 2 3; do
            flutter build apk --release && exit 0
            echo "Fallo de descarga, reintento $i"; sleep 30
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with: { name: app-release, path: build/app/outputs/flutter-apk/app-release.apk }